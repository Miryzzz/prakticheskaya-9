<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Наша команда</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="container header-content">
      <a class="logo" href="#home">Наша команда</a>
      <nav aria-label="Основное меню">
        <a href="#home">Главная</a>
        <a href="#about">О нас</a>
      </nav>
    </div>
  </header>
  <main>
    <section class="hero" id="home">
      <div class="container">
        <h1>Добро пожаловать на наш сайт!</h1>
        <p>Мы создаём простые и удобные веб-проекты.</p>
      </div>
    </section>
    <section class="section" id="about">
      <div class="container">
        <h2>О нас</h2>
        <p>Мы небольшая команда начинающих разработчиков. Учимся работать вместе и делать красивые сайты.</p>
        <img class="team-image" src="assets/team.svg" alt="Иллюстрация команды разработчиков">
      </div>
    </section>
  </main>
  <footer class="footer"><div class="container">© 2026 Наша команда</div></footer>
</body>
</html>
